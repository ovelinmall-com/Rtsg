name: OVELIN SPACE APK Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Build Environment
        run: |
          java -version
          gradle --version
          ls "$ANDROID_HOME/ndk"

      - name: Build OVELIN SPACE
        working-directory: OVELIN-SPACE
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        run: |
          mkdir -p apk-output

          find OVELIN-SPACE/app/build/outputs/apk \
            -type f -name '*.apk' \
            -exec cp {} apk-output/ \;

          test -n "$(ls -A apk-output)"

          ls -lh apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OVELIN-SPACE-APK
          path: apk-output/*.apk
          retention-days: 30
          if-no-files-found: error
