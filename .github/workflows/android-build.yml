name: OVELIN SPACE BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Build Debug APK
        working-directory: OVELIN-SPACE
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$(find OVELIN-SPACE -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "APK file was not generated."
            exit 1
          fi

          echo "APK generated: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: OVELIN-SPACE-NEW-APK
          path: OVELIN-SPACE/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
